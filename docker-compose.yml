services:
  api:
    build: .
    volumes:
      - ./src/api:/usr/src/app
      - ./etc/cyclos:/cyclos
      - ./etc/dolibarr:/dolibarr
    ports:
      - "8000:8000"
    environment:
      - DJANGO_DEBUG=True
      - API_PUBLIC_URL=http://localhost:8000
      - DOLIBARR_PUBLIC_URL=http://localhost:8080
      - BDC_PUBLIC_URL=http://localhost:8001
      - GI_PUBLIC_URL=http://localhost:8002
      - CEL_PUBLIC_URL=http://localhost:8003
      - EMAIL_NOTIFICATION_GESTION=gestion@euskalmoneta.org
      - RAVEN_CONFIG_DSN=http://46498c24303d4b27828e5e47ce927818:6177efcf6d1d47508f1c22332c8dddaf@sentry:9000/2
    depends_on:
      dolibarr-db:
        condition: service_started
      cyclos-db:
        condition: service_started
      dolibarr-app:
        condition: service_started
      cyclos-app:
        condition: service_started
    networks:
      - eusko_net
    restart: unless-stopped

  dolibarr-app:
    image: euskalmoneta/dolibarr:custom
    ports:
      - "8080:80"
    volumes:
      - ./data/documents:/var/www/documents
      - ./etc/dolibarr/conf.php:/var/www/html/conf/conf.php
      - ./etc/dolibarr/date-timezone.ini:/usr/local/etc/php/conf.d/date-timezone.ini
    depends_on:
      dolibarr-db:
        condition: service_started
      cyclos-app:
        condition: service_started
    networks:
      - eusko_net
    restart: unless-stopped

  dolibarr-db:
    image: mariadb:10.11
    volumes:
      - ./etc/dolibarr/dump:/docker-entrypoint-initdb.d
      - dolibarr_data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=pass
      - MYSQL_DATABASE=pass
      - MYSQL_USER=pass
      - MYSQL_PASSWORD=pass
    networks:
      - eusko_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  cyclos-app:
    image: cyclos/cyclos:4.13.1
    platform: linux/amd64
    ports:
      - "8081:8080"
    environment:
      - DB_HOST=cyclos-db
      - DB_NAME=cyclos
      - DB_USER=cyclos
      - DB_PASSWORD=cyclos
      - JAVA_OPTS=-Xmx2g -XX:+UseContainerSupport
    security_opt:
      - seccomp:unconfined
    ulimits:
      memlock: -1
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      cyclos-db:
        condition: service_started
    networks:
      - eusko_net
    restart: unless-stopped

  cyclos-db:
    image: cyclos/db
    volumes:
      - ./etc/cyclos/dump/cyclos.sql:/docker-entrypoint-initdb.d/cyclos.sql
      - cyclos_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=cyclos
      - POSTGRES_USER=cyclos
      - POSTGRES_PASSWORD=cyclos
    networks:
      - eusko_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyclos"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  eusko_net:
    driver: bridge

volumes:
  dolibarr_data:
    driver: local
  cyclos_data:
    driver: local